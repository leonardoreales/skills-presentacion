<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Flujo 1 · Ingesta de activos</title>
<!-- EJEMPLO de la skill presentacion-viva: datos FICTICIOS. Copiar como flujo-N-<slug>.html y reescribir T, X, nodos y paneles con el flujo real. -->
<link rel="stylesheet" href="comun.css">
<style>
  .months { display: grid; grid-template-columns: repeat(4, 132px); gap: 14px; margin: 18px 0 0 22px; }
  .mt { height: 66px; border-radius: 12px; border: 1.5px solid var(--faint); background: rgba(var(--bg-rgb),.7);
        display: flex; align-items: center; justify-content: center; font-family: 'Consolas', monospace; font-size: 26px; color: var(--dim); }
  .checks { margin: 10px 0 0 20px; }
  .sheet { position: absolute; left: 10px; top: 30px; width: 580px; border-radius: 14px; overflow: hidden; border: 1.5px solid var(--line); background: rgba(var(--bg-rgb),.75); }
  .srow { display: flex; height: 62px; align-items: center; border-top: 1px solid var(--track); }
  .srow.head { border-top: 0; height: 52px; background: rgba(var(--mute-rgb),.07); font-family: 'Consolas', monospace; font-size: 22px; color: var(--mute); letter-spacing: .04em; }
  .srow > div { padding: 0 20px; }
  .srow .c1 { width: 210px; flex: none; } .srow .c3 { flex: 1; border-left: 1px solid var(--track); height: 100%; display: flex; align-items: center; }
  .srow.head .c3 { color: var(--goldL); }
  .srow.ours { background: rgba(var(--gold-rgb),.08); }
  .typed { font-family: 'Consolas', monospace; font-size: 30px; color: var(--ink); letter-spacing: .03em; }
  .caret { display: inline-block; width: 3px; height: 30px; background: var(--goldL); margin-left: 3px; }
  .res-num { position: absolute; left: 50px; top: 66px; font-size: 176px; font-weight: 600; line-height: 1; color: var(--goldL); letter-spacing: -.01em; }
  .res-txt { position: absolute; left: 430px; top: 100px; font-size: 54px; font-weight: 600; line-height: 1.12; }
  .res-txt .g { color: var(--goldL); }
  .res-chips { position: absolute; left: 56px; bottom: 42px; display: flex; gap: 14px; }
  .tiles { position: absolute; left: 1050px; top: 70px; display: grid; grid-template-columns: repeat(10, 40px); gap: 10px; }
  .tile { height: 22px; border-radius: 5px; border: 1.5px solid var(--faint); background: rgba(var(--bg-rgb),.7); }
  .tiles-cap { position: absolute; left: 1050px; top: 222px; font-size: 26px; color: var(--mute); }
</style>
</head>
<body>
<div id="stage"></div>
<script src="motor.js"></script>
<script>
(function () {
  const C = SV.tema('americana'); // colores por rol: cambia el tema aquí y en cfg.tema
  const { prog, ease, mix, clamp, checkSvg } = SV;
  const Y = 450;
  const X = [230, 500, 770, 1040, 1310, 1580];
  const T = [2.0, 3.55, 5.1, 7.05, 8.6, 10.15];
  const XEND = 1730, TEND = 10.95, TRES = 11.0;
  const PLACA = '100000000042';

  // ---------- Artefactos ----------
  let ticks = '';
  for (let i = 0; i < 12; i++) ticks += '<line x1="0" y1="-97" x2="0" y2="-108" transform="rotate(' + (i * 30) + ')" stroke="' + (i % 3 === 0 ? C.goldL : C.line) + '" stroke-width="3" stroke-linecap="round"/>';
  const artVigia = '<svg viewBox="0 0 600 272" width="600" height="272">' +
    '<g transform="translate(140,136)"><g data-pop="0.1">' +
    '<circle r="112" fill="' + SV.rgba(C.bg, .78) + '" stroke="' + C.faint + '" stroke-width="2"/>' +
    '<circle r="76" fill="none" stroke="' + C.faint + '" stroke-width="1.5" stroke-dasharray="3 7"/>' + ticks +
    '<g class="sweep"><path d="M0 0 L0 -104 A104 104 0 0 0 -59.6 -85.2 Z" fill="' + C.gold + '" opacity=".2"/>' +
    '<path d="M0 0 L0 -104 A104 104 0 0 0 -26.9 -100.5 Z" fill="' + C.gold + '" opacity=".25"/>' +
    '<line x1="0" y1="0" x2="0" y2="-104" stroke="' + C.goldL + '" stroke-width="3.5" stroke-linecap="round"/></g>' +
    '<circle r="8" fill="' + C.goldL + '"/></g></g>' +
    '<g data-pop="0.25">' +
    '<rect x="320" y="34" width="250" height="176" rx="12" fill="' + SV.rgba(C.ink, .04) + '" stroke="' + C.line + '" stroke-width="1.5"/>' +
    '<path d="M332 34 H558 A12 12 0 0 1 570 46 V68 H320 V46 A12 12 0 0 1 332 34 Z" fill="' + SV.rgba(C.gold, .24) + '"/>' +
    '<line x1="320" y1="104" x2="570" y2="104" stroke="' + C.track + '"/><line x1="320" y1="140" x2="570" y2="140" stroke="' + C.track + '"/><line x1="320" y1="176" x2="570" y2="176" stroke="' + C.track + '"/>' +
    '<line x1="410" y1="68" x2="410" y2="210" stroke="' + C.track + '"/><line x1="490" y1="68" x2="490" y2="210" stroke="' + C.track + '"/>' +
    '<rect x="334" y="82" width="58" height="9" rx="4" fill="' + SV.rgba(C.mute, .3) + '"/><rect x="424" y="82" width="50" height="9" rx="4" fill="' + SV.rgba(C.mute, .3) + '"/><rect x="504" y="82" width="52" height="9" rx="4" fill="' + SV.rgba(C.mute, .3) + '"/>' +
    '<rect x="334" y="118" width="64" height="9" rx="4" fill="' + SV.rgba(C.mute, .3) + '"/><rect x="424" y="118" width="40" height="9" rx="4" fill="' + SV.rgba(C.mute, .3) + '"/><rect x="504" y="118" width="46" height="9" rx="4" fill="' + SV.rgba(C.mute, .3) + '"/>' +
    '<rect x="334" y="154" width="50" height="9" rx="4" fill="' + SV.rgba(C.mute, .3) + '"/><rect x="424" y="154" width="56" height="9" rx="4" fill="' + SV.rgba(C.mute, .3) + '"/><rect x="504" y="154" width="38" height="9" rx="4" fill="' + SV.rgba(C.mute, .3) + '"/>' +
    '<rect x="334" y="190" width="60" height="9" rx="4" fill="' + SV.rgba(C.mute, .3) + '"/><rect x="424" y="190" width="44" height="9" rx="4" fill="' + SV.rgba(C.mute, .3) + '"/><rect x="504" y="190" width="50" height="9" rx="4" fill="' + SV.rgba(C.mute, .3) + '"/>' +
    '<rect class="scanglow" x="322" y="70" width="246" height="16" fill="' + C.gold + '" opacity=".18"/>' +
    '<rect class="scan" x="322" y="70" width="246" height="3" fill="' + C.goldL + '" opacity=".9"/></g>' +
    '<text x="445" y="252" text-anchor="middle" font-size="26" fill="' + C.mute + '" data-in="0.45">Hoja de la póliza</text></svg>';

  const MESES = ['ENE', 'FEB', 'MAR', 'ABR', 'MAY', 'JUN', 'JUL', 'AGO', 'SEP', 'OCT', 'NOV', 'DIC'];
  const artLectura = '<div class="months">' + MESES.map(m => '<div class="mt">' + m + '</div>').join('') + '</div>';

  const artValida = '<div class="checks">' +
    '<div class="ck" data-in="0.2">' + checkSvg(0.3) + '<span>Datos limpios</span></div>' +
    '<div class="ck" data-in="0.38">' + checkSvg(0.48) + '<span>Separada por cantidad</span></div>' +
    '<div class="ck" data-in="0.56">' + checkSvg(0.66) + '<span>Cuenta contable validada</span></div>' +
    '<div class="ck warn" data-in="0.74"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="none" stroke="' + C.goldTxt + '" stroke-width="2" stroke-dasharray="4 4"/><rect x="18.3" y="10" width="3.4" height="13" rx="1.7" fill="' + C.goldTxt + '"/><circle cx="20" cy="28.5" r="2.3" fill="' + C.goldTxt + '"/></svg><span>Con problema: a la sala de espera</span></div>' +
    '</div>';

  // Placa: C BB TT XXXXXXX, con aire entre grupos
  let tsp = '';
  const gaps = [0, 1, 3, 5];
  let xx = 300 - (12 * 34 + 3 * 18) / 2 + 17;
  for (let i = 0; i < 12; i++) { if (i === 1 || i === 3 || i === 5) xx += 18; tsp += '<tspan class="dg" x="' + xx.toFixed(1) + '">0</tspan>'; xx += 34; }
  const artPlaca = '<svg viewBox="0 0 600 272" width="600" height="272"><defs><linearGradient id="plG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + C.bg3 + '"/><stop offset="1" stop-color="' + C.node + '"/></linearGradient></defs>' +
    '<g data-pop="0.12"><rect x="18" y="34" width="564" height="168" rx="20" fill="url(#plG)" stroke="' + C.gold + '" stroke-width="2.5"/>' +
    '<rect x="32" y="48" width="536" height="140" rx="13" fill="none" stroke="' + SV.rgba(C.goldL, .22) + '" stroke-width="1.5"/>' +
    '<text x="54" y="88" font-size="22" fill="' + C.mute + '" letter-spacing="1">Sistema · código del registro</text>' +
    '<text class="digits" y="160" text-anchor="middle" font-family="Consolas" font-size="56" fill="' + C.ink + '">' + tsp + '</text>' +
    '<rect class="sheen" x="18" y="34" width="70" height="168" fill="#fff" opacity="0"/></g>' +
    '<text x="300" y="250" text-anchor="middle" font-size="26" fill="' + C.mute + '" data-in="1.15">12 dígitos, sin duplicados</text></svg>';

  const artMarca = '<div class="sheet" data-pop="0.08">' +
    '<div class="srow head"><div class="c1">DESCRIPCIÓN</div><div class="c3">CODIGO_ASIGNADO</div></div>' +
    '<div class="srow"><div class="c1"><span class="bar" style="width:170px"></span></div><div class="c3"><span class="typed" style="color:' + C.mute + '">100000000041</span></div></div>' +
    '<div class="srow ours"><div class="c1"><span class="bar" style="width:200px;background:' + SV.rgba(C.goldL, .45) + '"></span></div><div class="c3"><span class="typed t1"></span><span class="caret"></span>' +
    '<svg viewBox="0 0 40 40" style="width:34px;height:34px;margin-left:auto">' +
    '<circle cx="20" cy="20" r="17" fill="' + SV.rgba(C.gold, .16) + '" stroke="' + C.goldL + '" stroke-width="2" data-pop="1.05"/><path d="M12 20.5 L18 26.5 L29 14" fill="none" stroke="' + C.goldL + '" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" data-draw="1.15,0.3"/></svg></div></div>' +
    '<div class="srow"><div class="c1"><span class="bar" style="width:130px"></span></div><div class="c3"></div></div>' +
    '</div>';

  const artReporte = '<svg viewBox="0 0 600 272" width="600" height="272">' +
    '<g transform="translate(40,30)"><g data-pop="0.08">' +
    '<g class="hoja"><rect x="26" y="40" width="168" height="150" rx="8" fill="' + C.ink + '" opacity=".95"/>' +
    '<rect x="44" y="60" width="90" height="10" rx="5" fill="' + C.gold + '"/>' +
    '<rect x="44" y="84" width="128" height="7" rx="3.5" fill="' + C.mute + '"/><rect x="44" y="100" width="110" height="7" rx="3.5" fill="' + C.mute + '"/><rect x="44" y="116" width="122" height="7" rx="3.5" fill="' + C.mute + '"/></g>' +
    '<rect x="0" y="96" width="220" height="132" rx="12" fill="' + C.bg3 + '" stroke="' + C.line + '" stroke-width="2"/>' +
    '<path d="M2 100 L110 168 L218 100" fill="none" stroke="' + C.gold + '" stroke-width="2.5" stroke-linejoin="round"/>' +
    '</g></g>' +
    '<text x="310" y="96" font-size="34" font-weight="600" fill="' + C.ink + '" data-in="0.45">Reporte</text>' +
    '<text x="310" y="138" font-size="34" font-weight="600" fill="' + C.ink + '" data-in="0.5">de la ingesta</text>' +
    '<text x="310" y="184" font-size="28" fill="' + C.mute + '" data-in="0.65">con lo que entró</text>' +
    '<g data-in="0.8"><circle cx="320" cy="222" r="6" fill="' + C.goldL + '"/><rect x="338" y="217" width="150" height="10" rx="5" fill="' + SV.rgba(C.mute, .35) + '"/></g>' +
    '</svg>';

  let tiles = '';
  for (let i = 0; i < 40; i++) tiles += '<div class="tile"></div>';
  const artRes = '<div class="res-eyebrow" data-in="0.05">Resultado</div>' +
    '<div class="res-num" data-in="0.05"><span class="cnt">0</span></div>' +
    '<div class="res-txt" data-in="0.3"><div>activos registrados</div><div class="g">sin digitar</div></div>' +
    '<div class="res-chips" data-in="0.6"><span class="chip state"><span class="cdot"></span>ACTIVO</span><span class="chip info">cifra de ejemplo</span></div>' +
    '<div class="tiles" data-in="0.2">' + tiles + '</div>' +
    '<div class="tiles-cap" data-in="0.5">directo al inventario</div>';

  SV.run({
    tema: 'americana',
    duration: 14,
    eyebrow: 'Ejemplo · Flujo 1 de 1',
    title: 'Ingesta de activos',
    subtitle: 'De la póliza de Compras al inventario, sin digitar',
    ficha: {
      kinds: ['row'],
      segs: SV_route(),
      alpha: t => ease.outCubic(prog(t, 1.45, 1.8)),
      scale: t => 1 - 0.12 * prog(t, TEND, TEND + 0.4)
    },
    tracks: [{ x0: 100, x1: 1790, y: Y }],
    nodes: [
      { x: X[0], y: Y, num: '01', name: 'Vigía', arr: T[0], next: T[1] },
      { x: X[1], y: Y, num: '02', name: 'Lectura', arr: T[1], next: T[2] },
      { x: X[2], y: Y, num: '03', name: 'Validación', arr: T[2], next: T[3] },
      { x: X[3], y: Y, num: '04', name: 'Placa', arr: T[3], next: T[4] },
      { x: X[4], y: Y, num: '05', name: 'Marca la hoja', arr: T[4], next: T[5] },
      { x: X[5], y: Y, num: '06', name: 'Reporte', arr: T[5], next: TEND }
    ],
    panel: { x: 140, y: 680, w: 1640, h: 320 },
    pointer: [{ t: T[0], x: X[0] }, { t: T[1], x: X[1] }, { t: T[2], x: X[2] }, { t: T[3], x: X[3] }, { t: T[4], x: X[4] }, { t: T[5], x: X[5] }, { t: TRES, x: XEND }],
    panels: [
      { t0: T[0], t1: T[1], eyebrow: 'Etapa 01 de 06', phrase: 'Un vigía revisa la póliza cada hora',
        chips: [{ t: 'cada hora' }, { t: 'al llegar el correo de Compras' }, { t: 'bajo demanda' }],
        html: artVigia,
        tick: (lt, el) => {
          el.querySelector('.sweep').setAttribute('transform', 'rotate(' + (lt * 210).toFixed(2) + ')');
          const y = 70 + ((Math.max(lt, 0) * 115) % 136);
          el.querySelector('.scan').setAttribute('y', y.toFixed(1));
          el.querySelector('.scanglow').setAttribute('y', (y - 13).toFixed(1));
        } },
      { t0: T[1], t1: T[2], eyebrow: 'Etapa 02 de 06', phrase: 'Lee todos los meses del año de una vez',
        chips: [{ t: 'despliega las celdas combinadas' }],
        html: artLectura,
        tick: (lt, el) => {
          el.querySelectorAll('.mt').forEach((m, i) => {
            const a = 0.2 + i * 0.045;
            const ap = ease.outCubic(prog(lt, a - 0.15, a + 0.15));
            const p = ease.outCubic(prog(lt, a, a + 0.3));
            m.style.opacity = ap.toFixed(3);
            m.style.borderColor = mix(C.faint, C.gold, p);
            m.style.background = SV.rgba(C.gold, (0.15 * p).toFixed(3));
            m.style.color = mix(C.dim, C.cream, p);
          });
        } },
      { t0: T[2], t1: T[3], eyebrow: 'Etapa 03 de 06', phrase: 'Limpia, separa por cantidad y valida la cuenta contable',
        chips: [{ t: 'no se pierden ni entran mal' }],
        html: artValida },
      { t0: T[3], t1: T[4], eyebrow: 'Etapa 04 de 06', phrase: 'La base genera la placa de 12 dígitos',
        chips: [{ t: 'proveedor · orden de compra · evidencia' }, { t: 'si llega dos veces, no se duplica' }],
        html: artPlaca,
        tick: (lt, el) => {
          el.querySelectorAll('.dg').forEach((d, i) => {
            const settle = 0.35 + i * 0.06;
            let ch, col;
            if (lt < settle) { ch = String((Math.floor(Math.max(lt, 0) * 26) + i * 7) % 10); col = C.dim; }
            else { ch = PLACA[i]; const f = clamp(1 - (lt - settle) / 0.5); col = mix(C.ink, C.cream, f); }
            if (d.textContent !== ch) d.textContent = ch;
            d.setAttribute('fill', col);
          });
          const s = prog(lt, 1.05, 1.6);
          const sh = el.querySelector('.sheen');
          sh.setAttribute('x', (18 + s * 500).toFixed(1));
          sh.setAttribute('opacity', (s > 0 && s < 1 ? 0.08 * Math.sin(Math.PI * s) : 0).toFixed(3));
        } },
      { t0: T[4], t1: T[5], eyebrow: 'Etapa 05 de 06', phrase: 'Marca la hoja con la placa asignada',
        chips: [{ t: 'CODIGO_ASIGNADO', k: 'state', at: 1.0 }],
        html: artMarca,
        tick: (lt, el) => {
          const n = Math.floor(prog(lt, 0.4, 1.0) * 12 + 0.0001);
          const t1 = el.querySelector('.t1'); const s = PLACA.slice(0, n);
          if (t1.textContent !== s) t1.textContent = s;
          const car = el.querySelector('.caret');
          car.style.opacity = (lt < 1.0 ? (Math.floor(lt * 4) % 2 === 0 ? 1 : 0.15) : 0).toString();
        } },
      { t0: T[5], t1: TRES, eyebrow: 'Etapa 06 de 06', phrase: 'Envía por correo el reporte de lo que entró',
        chips: [{ t: 'sin que nadie lo inicie' }],
        html: artReporte,
        tick: (lt, el) => {
          const p = ease.outCubic(prog(lt, 0.25, 0.85));
          el.querySelector('.hoja').setAttribute('transform', 'translate(0,' + ((1 - p) * 70 - 10 * p).toFixed(2) + ')');
        } },
      { t0: TRES, t1: null, full: true, html: artRes,
        tick: (lt, el) => {
          const p = ease.outCubic(prog(lt, 0.15, 1.35));
          const n = Math.round(120 * p);
          const c = el.querySelector('.cnt'); if (c.textContent !== String(n)) c.textContent = String(n);
          const lit = Math.round(40 * p);
          el.querySelectorAll('.tile').forEach((tl, i) => {
            const on = i < lit ? 1 : 0;
            tl.style.background = on ? SV.rgba(C.gold, .55) : SV.rgba(C.bg, .7);
            tl.style.borderColor = on ? C.goldL : C.faint;
          });
        } }
    ],
    extra: api => {
      const { S, D, L, ups, makeFicha, makeNode } = api;
      // Rama: sala de espera
      const link = S('path', { d: 'M770 450 Q770 590 900 590', fill: 'none', stroke: C.line, 'stroke-width': 2.5, 'stroke-dasharray': '5 8' }, L.links);
      ups.push(t => {
        const a = ease.outCubic(prog(t, 1.4, 1.9));
        const lit = prog(t, 5.75, 6.3);
        link.setAttribute('opacity', a.toFixed(3));
        link.setAttribute('stroke', mix(C.line, C.gold, lit * 0.85));
      });
      makeFicha({
        kinds: ['rowHollow'], layer: L.sat, trailLayer: L.sat, trailColor: C.goldTxt, glow: 0.22, glowColor: C.gold,
        segs: [{ t0: 5.78, t1: 6.42, x0: 770, y0: 450, x1: 900, y1: 590, cx: 770, cy: 590 }],
        alpha: t => clamp(prog(t, 5.74, 5.9)) * (1 - 0.3 * prog(t, T[3], T[3] + 0.5))
      });
      makeNode({ x: 900, y: 590, name: 'Sala de espera', sub: 'se avisa por correo', labelPos: 'right', arr: 6.42, next: T[3], dashed: true, noCheck: true, appear: 1.5 }, 6);
      // Terminal: inventario
      const g = S('g', { transform: 'translate(' + XEND + ',' + Y + ')' }, L.nodes);
      const pulse = S('rect', { x: -14, y: -14, width: 28, height: 28, transform: 'rotate(45)', fill: 'none', stroke: C.goldL, 'stroke-width': 2, opacity: 0 }, g);
      const dia = S('rect', { x: -13, y: -13, width: 26, height: 26, transform: 'rotate(45)', fill: C.node, stroke: C.faint, 'stroke-width': 2.5 }, g);
      const lab = D('nlabel', api.html, '<div class="name" style="font-size:28px">Inventario</div>');
      lab.style.left = (XEND - 135) + 'px'; lab.style.top = (Y + 34) + 'px';
      ups.push(t => {
        const a = ease.outCubic(prog(t, 1.6, 2.1));
        g.setAttribute('opacity', a.toFixed(3)); lab.style.opacity = a.toFixed(3);
        const lit = ease.outCubic(prog(t, TEND, TEND + 0.35));
        dia.setAttribute('fill', mix(C.node, C.gold, lit * 0.9));
        dia.setAttribute('stroke', mix(C.faint, C.goldL, lit));
        lab.querySelector('.name').style.color = mix(C.dim, C.ink, lit);
        const pp = prog(t, TEND, TEND + 1.0);
        const s = 1 + 2.2 * ease.outCubic(pp);
        pulse.setAttribute('transform', 'rotate(45) scale(' + s.toFixed(3) + ')');
        pulse.setAttribute('opacity', (pp > 0 && pp < 1 ? 0.8 * (1 - pp) : 0).toFixed(3));
      });
    }
  });

  function SV_route() {
    const segs = [];
    let px = 100;
    const stops = [[T[0], X[0], 0.5], [T[1], X[1]], [T[2], X[2]], [T[3], X[3]], [T[4], X[4]], [T[5], X[5]], [TEND, XEND, 0.6]];
    for (const s of stops) { const tr = s[2] || 0.55; segs.push({ t0: s[0] - tr, t1: s[0], x0: px, y0: Y, x1: s[1], y1: Y }); px = s[1]; }
    return segs;
  }
})();
</script>
</body>
</html>
